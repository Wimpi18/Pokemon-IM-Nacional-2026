<nav
  class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-xl border-t border-outline-variant/20"
>
  <div
    class="max-w-2xl mx-auto flex justify-around items-center px-4 pt-1.5 pb-[max(0.375rem,env(safe-area-inset-bottom))]"
  >
    @for (item of navItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-primary/10"
        #rla="routerLinkActive"
        class="flex flex-col items-center justify-center gap-0.5 py-1.5 px-3 rounded-xl min-w-16 transition-all duration-200 active:scale-95 no-underline"
        [class.hover:bg-surface-container-high]="!rla.isActive"
      >
        <span
          class="material-symbols-outlined text-[22px]"
          [class.text-primary]="rla.isActive"
          [class.text-on-surface-variant]="!rla.isActive"
          [style.font-variation-settings]="getFillStyle(rla.isActive)"
          >{{ item.icon }}</span
        >
        <span
          class="font-label text-[10px] uppercase tracking-wider"
          [class.font-bold]="rla.isActive"
          [class.text-primary]="rla.isActive"
          [class.font-medium]="!rla.isActive"
          [class.text-on-surface-variant]="!rla.isActive"
          >{{ item.label }}</span
        >
      </a>
    }
  </div>
</nav>
