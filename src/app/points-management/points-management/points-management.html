<main class="max-w-2xl mx-auto px-5 pt-6 pb-28 space-y-6">
  <!-- Success Toast -->
  @if (showSuccess()) {
    <div
      class="fixed top-16 left-1/2 -translate-x-1/2 z-60 bg-tertiary text-on-tertiary px-5 py-3 rounded-xl shadow-lg flex items-center gap-2 animate-slide-in"
    >
      <span
        class="material-symbols-outlined text-lg"
        style="font-variation-settings: 'FILL' 1"
        >check_circle</span
      >
      <span class="font-headline font-bold text-sm"
        >Puntos guardados exitosamente</span
      >
    </div>
  }

  <!-- Hero Card -->
  <div
    class="relative overflow-hidden bg-surface-container-lowest rounded-2xl border border-outline-variant/20 p-6 shadow-sm"
  >
    <div class="relative z-10 flex items-start justify-between gap-4">
      <div>
        <span
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-tertiary/10 text-tertiary text-[10px] font-bold uppercase tracking-widest mb-3"
        >
          <span
            class="material-symbols-outlined text-sm"
            style="font-variation-settings: 'FILL' 1"
            >shield_person</span
          >
          Herramienta de Dirigente
        </span>
        <h2
          class="text-2xl sm:text-3xl font-extrabold text-on-surface leading-tight"
        >
          Dar o quitar puntos
        </h2>
      </div>
      <div
        class="w-12 h-12 rounded-xl bg-primary/8 flex items-center justify-center shrink-0"
      >
        <span
          class="material-symbols-outlined text-primary text-3xl"
          style="font-variation-settings: 'FILL' 1"
          >stars</span
        >
      </div>
    </div>
    <!-- Decorative gradient -->
    <div
      class="absolute -bottom-6 -right-6 w-32 h-32 bg-primary/5 rounded-full blur-2xl"
    ></div>
  </div>

  <!-- Management Form -->
  <section class="space-y-5">
    <!-- Dropdown Selection -->
    <app-autocomplete
      label="Seleccionar Patrulla o Cursante"
      placeholder="Buscar patrulla o cursante..."
      [options]="targetOptions()"
      [(value)]="selectedTarget"
    />

    <!-- Point Input -->
    <app-number-input label="Puntos" [(value)]="pointsAdjustment" />

    <!-- Justification Area -->
    <app-textarea-field
      label="Justificación (Obligatoria)"
      placeholder="Describe el motivo de este puntaje (ej., 'Ganaron el juego del módulo' o 'Faltó al módulo')..."
      [rows]="4"
      [(value)]="justification"
    />
  </section>

  <!-- Form Actions -->
  <div class="flex gap-3 pt-2">
    <app-button
      variant="destructive"
      (click)="saveChanges()"
      [isDisabled]="!isValid() || isSaving()"
      customClass="gap-2"
    >
      @if (isSaving()) {
        <span class="material-symbols-outlined text-lg animate-spin"
          >progress_activity</span
        >
        Guardando...
      } @else {
        <span
          class="material-symbols-outlined text-lg"
          style="font-variation-settings: 'FILL' 1"
          >save</span
        >
        Guardar Cambios
      }
    </app-button>
    <app-button variant="secondary" (click)="cancel()">Cancelar</app-button>
  </div>
</main>
